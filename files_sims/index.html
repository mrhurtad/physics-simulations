<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Simulations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F4; --panel:#FFFFFF; --ink:#16202B; --ink-soft:#5A6B79;
    --rule:#C8D3DC; --accent:#D98B00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.55}
  .frame{max-width:880px;margin:0 auto;padding:32px 20px 56px}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:8px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:1.6rem;font-weight:600;margin:0;letter-spacing:-0.01em}
  header p{margin:0;color:var(--ink-soft);font-size:0.92rem}
  .lang{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  .lang button{font:inherit;font-size:0.8rem;padding:4px 10px;border:0;background:var(--panel);
    color:var(--ink-soft);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .intro{color:var(--ink-soft);margin:18px 0 26px;max-width:60ch}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  a.card{
    display:block;background:var(--panel);border:1px solid var(--rule);border-radius:3px;
    padding:16px;text-decoration:none;color:inherit;transition:border-color .15s;
  }
  a.card:hover{border-color:var(--accent)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topic{font-size:0.72rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:6px}
  .name{font-size:1.05rem;font-weight:600;margin-bottom:6px}
  .desc{font-size:0.87rem;color:var(--ink-soft)}
  .soon{opacity:0.5}
  .soon:hover{border-color:var(--rule)}

  footer{margin-top:36px;font-size:0.82rem;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1 id="t-title">Physics Simulations</h1>
    <div class="lang">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-es" aria-pressed="false">ES</button>
    </div>
  </header>
  <p class="intro" id="t-intro">
    Interactive, browser-based simulations for introductory physics. No installs — open on a
    computer, tablet, or phone.
  </p>

  <div class="grid" id="grid"></div>

  <footer id="t-foot">Built with plain HTML/JS/CSS — no dependencies, no build step.</footer>
</div>

<script>
const SIMS = [
  {
    topic: {en:"Electricity", es:"Electricidad"},
    name: {en:"Coulomb's Law — Force Vector Explorer", es:"Ley de Coulomb — Explorador de vectores de fuerza"},
    desc: {en:"Drag point charges, isolate one, and see its free-body diagram with the force from every other charge.",
           es:"Arrastra cargas puntuales, aísla una y observa su diagrama de cuerpo libre con la fuerza de cada otra carga."},
    href: "coulomb-law/"
  }
  // Add new simulations here, one object per entry:
  // { topic:{en:"...",es:"..."}, name:{en:"...",es:"..."}, desc:{en:"...",es:"..."}, href:"folder-name/" }
];

const STR = {
  en:{title:"Physics Simulations",
      intro:"Interactive, browser-based simulations for introductory physics. No installs — open on a computer, tablet, or phone.",
      foot:"Built with plain HTML/JS/CSS — no dependencies, no build step."},
  es:{title:"Simulaciones de Física",
      intro:"Simulaciones interactivas para física introductoria, directamente en el navegador. Sin instalar nada — se abren en computadora, tablet o teléfono.",
      foot:"Hechas con HTML/JS/CSS puro — sin dependencias, sin pasos de compilación."}
};
let lang = "en";

function render(){
  document.getElementById("t-title").textContent = STR[lang].title;
  document.getElementById("t-intro").textContent = STR[lang].intro;
  document.getElementById("t-foot").textContent = STR[lang].foot;
  document.documentElement.lang = lang;
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("lang-es").setAttribute("aria-pressed", lang === "es");

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  SIMS.forEach(s => {
    const a = document.createElement("a");
    a.className = "card"; a.href = s.href;
    a.innerHTML = '<div class="topic">' + s.topic[lang] + '</div>' +
                  '<div class="name">' + s.name[lang] + '</div>' +
                  '<div class="desc">' + s.desc[lang] + '</div>';
    grid.appendChild(a);
  });
}
document.getElementById("lang-en").onclick = () => { lang = "en"; render(); };
document.getElementById("lang-es").onclick = () => { lang = "es"; render(); };
render();
</script>
</body>
</html>
